name = "wedding-gate"
main = "src/index.ts"
compatibility_date = "2026-09-06"
workers_dev = true

# wrangler deploy uploads the script; the route + DNS proxy flip are manual steps
# (see README "Manual steps"). To pin the route from here instead of the dashboard:
#   routes = [{ pattern = "rjheiraten-berlin.de/*", zone_name = "rjheiraten-berlin.de" }]

# Guest photo uploads. Create the bucket in the Cloudflare dashboard and enable its
# R2.dev public access for viewing uploaded images (write goes only through the Worker).
# The /api/upload and /api/gallery routes 404 if this binding is absent (feature off).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-guest-uploads"

# Gift registry: a single JSON document (items + reservations) written by
# `npm run gifts:upload`. The /api/gifts routes 404 if this binding is absent
# (feature off). Keep the bucket private; everything goes through the Worker.
[[r2_buckets]]
binding = "GIFTS"
bucket_name = "wedding-gift-registry"